# Static serving for the prod-like stack (T-DO-3).
#
# This file's job is to be the smallest honest stand-in for S3 + CloudFront:
# serve the built files, and answer a deep link the way the CDN will have to.
# It is not a reverse proxy, on purpose — the browser talks to the backend
# directly on its own origin here, exactly as it will talk to the ALB from a
# CloudFront-served page. Proxying /api through this server would make the
# local stack same-origin and stop exercising CORS (XC-12) and the SameSite
# cookie behaviour that the real deployment depends on, which would leave the
# one difference that matters untested.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames under /assets, so a given URL's content never
    # changes. Cache-Control matches what the CloudFront behaviour will set.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. react-router owns /requests/new, /requests/:id and the rest
    # client-side, so a reload or a pasted deep link must return index.html
    # rather than 404. CloudFront does this with a custom error response
    # mapping 403/404 to /index.html (T-DO-4); try_files is the same idea.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the one file whose URL is stable while its content changes
    # every deploy — it names the hashed bundles. Caching it is how a browser
    # ends up asking for assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
